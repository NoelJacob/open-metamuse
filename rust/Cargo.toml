[package]
name = "rust_lib_openmetamuse"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "desktop"
path = "src/bin/desktop/main.rs"

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.13.0"
iroh = { version = "1.3.0", features = ["tls-ring"], git = "https://github.com/NoelJacob/iroh" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "tokio-macros", "io-util", "signal", "time"] }
iroh-tickets = "1.0.0"

[patch.crates-io]
iroh-base = { git = "https://github.com/NoelJacob/iroh" }

[lints.rust]
